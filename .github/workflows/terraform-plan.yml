name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform
      - name: Terraform Plan
        run: terraform plan -no-color
        working-directory: infrastructure/terraform
